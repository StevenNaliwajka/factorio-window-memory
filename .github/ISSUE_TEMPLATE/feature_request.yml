name: Feature request
description: Suggest a change or a window the plugin should handle differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to change?
      description: Describe the situation and what you'd want the plugin to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered?
