name: Bug report
description: A window opens in the wrong place, the plugin doesn't load, or the game misbehaves with it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The two log files below usually pinpoint the problem; they're in
        `%APPDATA%\Factorio\window-memory`.
  - type: input
    id: factorio-version
    attributes:
      label: Factorio version
      description: Shown on the main menu, e.g. "2.0.77 (Steam, Space Age)".
    validations:
      required: true
  - type: input
    id: fwm-version
    attributes:
      label: factorio-window-memory version
      description: The release you downloaded, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How do you start it?
      options:
        - Steam launch option
        - Running fwm-launch.exe directly
        - fwm-launch.exe --attach
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Which window (inventory, chest, assembler, ...), where it opened, where you expected it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the inventory and drag it to the top left
        2. Close it and open a chest
        3. ...
  - type: textarea
    id: fwm-log
    attributes:
      label: fwm.log
      description: Paste the whole file.
      render: text
    validations:
      required: true
  - type: textarea
    id: launch-log
    attributes:
      label: fwm-launch.log
      description: The last few lines are enough.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The problem doesn't happen when Factorio is started without the plugin (or this is about the plugin itself).
