name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, build, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The injection tests load the built fwm_hook.dll, so build it before testing.
      # The installed-game test skips itself: runners don't have Factorio.
      - run: cargo build --workspace
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain as an input, not the ref: Dependabot would "bump" @1.85 as if it were a version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
