[workspace]
resolver = "2"
members = ["crates/fwm-core", "crates/fwm-hook", "crates/fwm-launch"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Oldest toolchain that builds the locked dependencies (uuid needs 1.85).
rust-version = "1.85"
license = "MIT"
authors = ["Steven Naliwajka"]
repository = "https://github.com/StevenNaliwajka/factorio-window-memory"
publish = false

[workspace.dependencies]
fwm-core = { path = "crates/fwm-core" }
pdb = "0.8"
retour = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
